<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicias Urbanas - Redirigiendo</title>
    <base href="/delicias-urbanas/">
    <script>
        // Redirección para manejar rutas de Angular
        (function() {
            const segment = 1;
            const l = window.location;
            
            // Preservar la ruta original
            sessionStorage.redirect = l.href;
            
            // Redirigir a la aplicación principal
            const newPath = l.protocol + '//' + l.hostname + 
                           (l.port ? ':' + l.port : '') +
                           '/delicias-urbanas/#' +
                           l.pathname + l.search + l.hash;
            
            location.replace(newPath);
        })();
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: linear-gradient(135deg, #e67e22, #34495e);
            color: white;
        }
        .loading {
            font-size: 18px;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading">
        <h1>Delicias Urbanas</h1>
        <div class="spinner"></div>
        <p>Redirigiendo a la aplicación...</p>
        <p>Si la redirección no funciona, <a href="/delicias-urbanas/" style="color: #fff; text-decoration: underline;">haz click aquí</a>.</p>
    </div>
    
    <script>
        // Redirección de respaldo después de 3 segundos
        setTimeout(function() {
            window.location.href = '/delicias-urbanas/';
        }, 3000);
    </script>
</body>
</html>
